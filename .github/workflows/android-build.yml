name: White-Label Android Build (APK & Play Store AAB)

# Runs ONLY when manually launched from the GitHub Actions tab.
# It does NOT run on commit, push, or pull request.
on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Unique Client Slug (e.g., pushtiprakash)'
        required: true
        default: 'pushtiprakash'
        type: string
      app_name:
        description: 'Native App Display Name'
        required: true
        default: 'PushtiPrakash'
        type: string
      app_id:
        description: 'Android Application ID / Package Name'
        required: true
        default: 'com.pushtiprakash.reader'
        type: string
      firebase_config_url:
        description: 'Remote Config URL for this Client'
        required: true
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/mock/'
        type: string
      logo_url:
        description: 'Direct URL to Client Logo PNG (Fallback if local src/assets/images/logo.png not present)'
        required: false
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/images/logo.png'
        type: string
      build_version:
        description: 'Semantic Version Name (e.g., 1.0.0)'
        required: true
        default: '2026.11.0'
        type: string
      version_code:
        description: 'Google Play Integer Version Code (e.g., 1, 2, 3...)'
        required: true
        default: '2'
        type: string

jobs:
  build-client-android:
    name: Build Android Packages for ${{ inputs.client_key }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Inject Client Config URL & Version into environment.prod.ts
        env:
          CLIENT_KEY: ${{ inputs.client_key }}
          FIREBASE_URL: ${{ inputs.firebase_config_url }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src/environments/environment.prod.ts";
            let content = fs.readFileSync(path, "utf8");
            const safeStr = (val) => String(val || "").replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27");
            content = content.replace(/__CLIENT_KEY__/g, safeStr(process.env.CLIENT_KEY));
            content = content.replace(/__FIREBASE_CONFIG_URL__/g, safeStr(process.env.FIREBASE_URL));
            content = content.replace(/__BUILD_VERSION__/g, safeStr(process.env.BUILD_VERSION));
            fs.writeFileSync(path, content, "utf8");
          '
          cat src/environments/environment.prod.ts

      - name: Stamp Client App ID and Name in Capacitor Config
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.appId = process.env.APP_ID;
            cfg.appName = process.env.APP_NAME;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

      - name: Build Angular Production Web Bundle
        run: npm run build -- --configuration=production

      - name: Sync Capacitor Android Project & Permissions
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 -c "
          import os, re, glob
          app_name = os.environ.get('APP_NAME', 'PushtiPrakash')
          app_id = os.environ.get('APP_ID', 'com.pushtiprakash.reader')

          strings_path = 'android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'<string name=\"app_name\">.*?</string>', f'<string name=\"app_name\">{app_name}</string>', content)
              content = re.sub(r'<string name=\"title_activity_main\">.*?</string>', f'<string name=\"title_activity_main\">{app_name}</string>', content)
              content = re.sub(r'<string name=\"package_name\">.*?</string>', f'<string name=\"package_name\">{app_id}</string>', content)
              content = re.sub(r'<string name=\"custom_url_scheme\">.*?</string>', f'<string name=\"custom_url_scheme\">{app_id}</string>', content)
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  mcontent = f.read()
              perms = [
                  'android.permission.POST_NOTIFICATIONS',
                  'android.permission.SCHEDULE_EXACT_ALARM',
                  'android.permission.USE_EXACT_ALARM',
                  'android.permission.RECEIVE_BOOT_COMPLETED',
                  'android.permission.VIBRATE'
              ]
              missing_tags = []
              for p in perms:
                  if p not in mcontent:
                      missing_tags.append(f'    <uses-permission android:name=\"{p}\" />')
              if missing_tags and '</manifest>' in mcontent:
                  mcontent = mcontent.replace('</manifest>', '\n'.join(missing_tags) + '\n</manifest>')
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(mcontent)

          for ma_path in glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True):
              with open(ma_path, 'r', encoding='utf-8') as f:
                  ma = f.read()
              if 'FLAG_SECURE' not in ma:
                  if 'import android.os.Bundle;' not in ma:
                      ma = ma.replace('import com.getcapacitor.BridgeActivity;', 'import android.os.Bundle;\nimport android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;')
                  elif 'import android.view.WindowManager;' not in ma:
                      ma = ma.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.view.WindowManager;')
                  if 'onCreate(' in ma:
                      ma = re.sub(r'(super\.onCreate\([^)]*\);)', r'\1\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);', ma)
                  else:
                      ma = ma.replace('BridgeActivity {', 'BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);\n    }\n')
                  with open(ma_path, 'w', encoding='utf-8') as f:
                      f.write(ma)
          "

      - name: Stamp Application ID, Version Code & Name in build.gradle
        env:
          APP_ID: ${{ inputs.app_id }}
          VERSION_CODE: ${{ inputs.version_code }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            if (fs.existsSync(path)) {
              let content = fs.readFileSync(path, "utf8");
              const appId = String(process.env.APP_ID || "com.pushtiprakash.reader").trim();
              const vCode = parseInt(process.env.VERSION_CODE || "1", 10) || 1;
              const vName = String(process.env.BUILD_VERSION || "1.0.0").replace(/"/g, "");
              content = content.replace(/applicationId\s+"[^"]*"/g, `applicationId "${appId}"`);
              content = content.replace(/versionCode\s+\d+/g, `versionCode ${vCode}`);
              content = content.replace(/versionName\s+"[^"]*"/g, `versionName "${vName}"`);
              fs.writeFileSync(path, content, "utf8");
              console.log(`Updated build.gradle: applicationId=${appId}, versionCode=${vCode}, versionName=${vName}`);
            }
          '

      - name: Stamp Android Launcher App Icon from Logo Location
        env:
          LOGO_URL: ${{ inputs.logo_url }}
        run: |
          mkdir -p /tmp
          if [ -f "src/assets/images/logo.png" ]; then
            echo "Found logo locally at src/assets/images/logo.png"
            cp src/assets/images/logo.png /tmp/logo.png
          elif [ -n "$LOGO_URL" ]; then
            echo "Downloading logo from remote URL $LOGO_URL..."
            curl -s -L "$LOGO_URL" -o /tmp/logo.png || true
          fi

          if [ -s /tmp/logo.png ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
            for res in "mdpi:48:24" "hdpi:72:36" "xhdpi:96:48" "xxhdpi:144:72" "xxxhdpi:192:96"; do
              folder=$(echo $res | cut -d: -f1)
              size=$(echo $res | cut -d: -f2)
              notif_size=$(echo $res | cut -d: -f3)

              dir="android/app/src/main/res/mipmap-${folder}"
              mkdir -p "$dir"
              icon_size=$(( size * 68 / 100 ))
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher.png" || true
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher_foreground.png" || true

              # Strip light background first so non-transparent logos produce a clean white silhouette
              notif_dir="android/app/src/main/res/drawable-${folder}"
              mkdir -p "$notif_dir"
              convert /tmp/logo.png -resize "${notif_size}x${notif_size}" \
                -fuzz 18% -transparent white -fuzz 18% -transparent "#fffdf9" -fuzz 18% -transparent "#fff8ec" \
                -alpha extract -background white -alpha shape "$notif_dir/ic_stat_notify.png" || true
            done
            echo "Successfully generated Android launcher icons and monochrome notification icons!"
          else
            echo "Warning: Logo PNG not found, defaulting to template icons."
          fi

      - name: Build Android Release APK and Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Sign Release APK and Play Store AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ]; then
            echo "Decoding production keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            ALIAS_NAME="${KEY_ALIAS:-pushtikey}"
            PASS_VAL="$KS_PASS"
            KPASS_VAL="${KEY_PASS:-$KS_PASS}"
          else
            echo "Notice: GitHub Secrets not configured. Generating keystore for signing..."
            ALIAS_NAME="pushtikey"
            PASS_VAL=$(openssl rand -hex 16)
            KPASS_VAL="$PASS_VAL"
            keytool -genkey -v -keystore release.keystore \
              -alias "$ALIAS_NAME" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS_VAL" -keypass "$KPASS_VAL" \
              -dname "CN=PushtiPrakash, OU=Mobile, O=Pushti, L=Mumbai, S=MH, C=IN"
          fi

          # 1. Align and sign Release APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "$ALIAS_NAME" \
            --ks-pass "pass:$PASS_VAL" --key-pass "pass:$KPASS_VAL" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify -v android/app/build/outputs/apk/release/app-release-signed.apk

          # 2. Sign Google Play Store AAB with jarsigner
          cp android/app/build/outputs/bundle/release/app-release.aab \
             android/app/build/outputs/bundle/release/app-release-signed.aab

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$PASS_VAL" -keypass "$KPASS_VAL" \
            android/app/build/outputs/bundle/release/app-release-signed.aab "$ALIAS_NAME"

          rm -f release.keystore
          echo "Both APK and Play Store AAB successfully signed!"

      - name: Purge jsDelivr CDN Cache for Active Tenant
        env:
          CONFIG_URL: ${{ inputs.firebase_config_url }}
        run: |
          if [[ "$CONFIG_URL" == *"cdn.jsdelivr.net/gh/"* ]]; then
            PURGE_BASE="${CONFIG_URL/https:\/\/cdn.jsdelivr.net\/gh\//https:\/\/purge.jsdelivr.net\/gh\/}"
            PURGE_BASE="${PURGE_BASE%/}/"
            for f in app_identity.json supportedLanguages.json ui_translations.json books.json updateBannerMessage.json about_info.json notification_schedules.json; do
              curl -s "${PURGE_BASE}${f}" || true
            done
          fi

      - name: Upload Installable Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-signed-apk-v${{ inputs.build_version }}
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 14

      - name: Upload Signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-signed-aab-v${{ inputs.build_version }}
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 14

