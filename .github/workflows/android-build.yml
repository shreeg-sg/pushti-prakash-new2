name: White-Label Android APK Build

on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Unique Client Slug (e.g., pushtiprakash)'
        required: true
        default: 'pushtiprakash'
        type: string
      app_name:
        description: 'Initial Native App Display Name'
        required: true
        default: 'PushtiPrakash'
        type: string
      app_id:
        description: 'Android Application ID / Package Name'
        required: true
        default: 'com.sameergujarathi.pushtiprakash'
        type: string
      firebase_config_url:
        description: 'Remote Config URL for this Client'
        required: true
        default: 'https://raw.githubusercontent.com/shreeg-sg/pushtiprakash-media/main/src/assets/mock/data.json'
        type: string
      logo_url:
        description: 'Direct URL to Client Logo PNG (Fallback if local src/assets/images/logo.png not present)'
        required: false
        default: 'https://raw.githubusercontent.com/shreeg-sg/pushtiprakash-media/main/src/assets/images/logo.png'
        type: string
      build_version:
        description: 'Semantic App Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build-client-apk:
    name: Build APK for ${{ inputs.client_key }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Inject Client Config URL & Version into environment.prod.ts
        env:
          CLIENT_KEY: ${{ inputs.client_key }}
          FIREBASE_URL: ${{ inputs.firebase_config_url }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          sed -i "s|__CLIENT_KEY__|${CLIENT_KEY}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_CONFIG_URL__|${FIREBASE_URL}|g" src/environments/environment.prod.ts
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" src/environments/environment.prod.ts
          cat src/environments/environment.prod.ts

      - name: Stamp Client App ID and Name in Capacitor Config
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          npx json -I -f capacitor.config.json -e "this.appId='${APP_ID}'; this.appName='${APP_NAME}';" || true

      - name: Build Angular Production Web Bundle
        run: npm run build -- --configuration=production

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|g" android/app/src/main/res/values/strings.xml
            sed -i "s|<string name=\"title_activity_main\">.*</string>|<string name=\"title_activity_main\">${{ inputs.app_name }}</string>|g" android/app/src/main/res/values/strings.xml
          fi

      # REQUIREMENT 2: Detect logo from local src/assets/images/logo.png OR remote URL and stamp Android launcher icons
      - name: Stamp Android Launcher App Icon from Logo Location
        run: |
          mkdir -p /tmp
          if [ -f "src/assets/images/logo.png" ]; then
            echo "Found logo locally at src/assets/images/logo.png"
            cp src/assets/images/logo.png /tmp/logo.png
          elif [ -n "${{ inputs.logo_url }}" ]; then
            echo "Downloading logo from remote URL ${{ inputs.logo_url }}..."
            curl -s -L "${{ inputs.logo_url }}" -o /tmp/logo.png || true
          fi

          if [ -s /tmp/logo.png ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
            for res in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              folder=$(echo $res | cut -d: -f1)
              size=$(echo $res | cut -d: -f2)
              dir="android/app/src/main/res/mipmap-${folder}"
              mkdir -p "$dir"
              convert /tmp/logo.png -resize "${size}x${size}" "$dir/ic_launcher.png" || true
              convert /tmp/logo.png -resize "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert /tmp/logo.png -resize "${size}x${size}" "$dir/ic_launcher_foreground.png" || true
            done
            echo "Successfully generated Android home screen launcher icons!"
          else
            echo "Warning: Logo image not found, keeping default icon."
          fi

      - name: Build Android APK (Debug / Unsigned Release)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Client Delivery
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-apk/${{ inputs.client_key }}-v${{ inputs.build_version }}.apk"

      - name: Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-v${{ inputs.build_version }}-apk
          path: dist-apk/${{ inputs.client_key }}-v${{ inputs.build_version }}.apk
          retention-days: 30