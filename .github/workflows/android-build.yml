name: White-Label Android Build (APK & Play Store AAB)

# Runs ONLY when manually launched from the GitHub Actions tab.
# It does NOT run on commit, push, or pull request.
on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Unique Client Slug (e.g., pushtiprakash)'
        required: true
        default: 'pushtiprakash'
        type: string
      app_name:
        description: 'Native App Display Name'
        required: true
        default: 'PushtiPrakash'
        type: string
      app_id:
        description: 'Android Application ID / Package Name'
        required: true
        default: 'com.pushtiprakash.reader'
        type: string
      firebase_config_url:
        description: 'Remote Config URL for this Client'
        required: true
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/mock/'
        type: string
      logo_url:
        description: 'Direct URL to Client Logo PNG (Fallback if local src/assets/images/logo.png not present)'
        required: false
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/images/logo.png'
        type: string
      build_version:
        description: 'Semantic Version Name (e.g., 1.0.0)'
        required: true
        default: '2026.11.0'
        type: string
      version_code:
        description: 'Google Play Integer Version Code (e.g., 1, 2, 3...)'
        required: true
        default: '2'
        type: string

jobs:
  build-client-android:
    name: Build Android Packages for ${{ inputs.client_key }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17 for Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Inject Client Config URL & Version into environment.prod.ts
        env:
          CLIENT_KEY: ${{ inputs.client_key }}
          FIREBASE_URL: ${{ inputs.firebase_config_url }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          sed -i "s|__CLIENT_KEY__|${CLIENT_KEY}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_CONFIG_URL__|${FIREBASE_URL}|g" src/environments/environment.prod.ts
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" src/environments/environment.prod.ts
          cat src/environments/environment.prod.ts

      - name: Stamp Client App ID and Name in Capacitor Config
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          npx json -I -f capacitor.config.json -e "this.appId='${APP_ID}'; this.appName='${APP_NAME}';" || true

      - name: Build Angular Production Web Bundle
        run: npm run build -- --configuration=production

      - name: Sync Capacitor Android Project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            python3 -c "
            import os, re
            path = 'android/app/src/main/res/values/strings.xml'
            app_name = os.environ.get('APP_NAME', 'PushtiPrakash')
            if os.path.exists(path):
                with open(path, 'r', encoding='utf-8') as f:
                    content = f.read()
                content = re.sub(r'<string name=\"app_name\">.*?</string>', f'<string name=\"app_name\">{app_name}</string>', content)
                content = re.sub(r'<string name=\"title_activity_main\">.*?</string>', f'<string name=\"title_activity_main\">{app_name}</string>', content)
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)
            "
          fi

      - name: Stamp Version Code & Name in build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s|versionCode [0-9]*|versionCode ${{ inputs.version_code }}|g" "$GRADLE_FILE"
            sed -i "s|versionName \".*\"|versionName \"${{ inputs.build_version }}\"|g" "$GRADLE_FILE"
            echo "Updated build.gradle with versionCode ${{ inputs.version_code }} and versionName ${{ inputs.build_version }}"
          fi

      - name: Stamp Android Launcher App Icon from Logo Location
        run: |
          mkdir -p /tmp
          if [ -f "src/assets/images/logo.png" ]; then
            echo "Found logo locally at src/assets/images/logo.png"
            cp src/assets/images/logo.png /tmp/logo.png
          elif [ -n "${{ inputs.logo_url }}" ]; then
            echo "Downloading logo from remote URL ${{ inputs.logo_url }}..."
            curl -s -L "${{ inputs.logo_url }}" -o /tmp/logo.png || true
          fi

          if [ -s /tmp/logo.png ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
            for res in "mdpi:48:24" "hdpi:72:36" "xhdpi:96:48" "xxhdpi:144:72" "xxxhdpi:192:96"; do
              folder=$(echo $res | cut -d: -f1)
              size=$(echo $res | cut -d: -f2)
              notif_size=$(echo $res | cut -d: -f3)

              dir="android/app/src/main/res/mipmap-${folder}"
              mkdir -p "$dir"
              icon_size=$(( size * 68 / 100 ))
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher.png" || true
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher_round.png" || true
              convert /tmp/logo.png -resize "${icon_size}x${icon_size}" -gravity center -background none -extent "${size}x${size}" "$dir/ic_launcher_foreground.png" || true

              # Auto-generate pure white (#FFFFFF) transparent silhouette for Android status bar notifications
              notif_dir="android/app/src/main/res/drawable-${folder}"
              mkdir -p "$notif_dir"
              convert /tmp/logo.png -resize "${notif_size}x${notif_size}" -alpha extract -background white -alpha shape "$notif_dir/ic_stat_notify.png" || true
            done
            echo "Successfully generated Android launcher icons and monochrome notification icons!"
          else
            echo "Warning: Logo PNG not found, defaulting to template icons."
          fi

      - name: Build Android Release APK and Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Sign Release APK with apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ]; then
            echo "Decoding production keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            ALIAS_NAME="${KEY_ALIAS:-pushtikey}"
            PASS_VAL="$KS_PASS"
            KPASS_VAL="${KEY_PASS:-$KS_PASS}"
          else
            echo "Notice: GitHub Secrets not configured. Generating temporary keystore for testing..."
            ALIAS_NAME="pushtikey"
            PASS_VAL=$(openssl rand -hex 16)
            KPASS_VAL="$PASS_VAL"
            keytool -genkey -v -keystore release.keystore \
              -alias "$ALIAS_NAME" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS_VAL" -keypass "$KPASS_VAL" \
              -dname "CN=PushtiPrakash, OU=Mobile, O=Pushti, L=Mumbai, S=MH, C=IN"
          fi

          # Align the unsigned APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          # Sign with apksigner (v1, v2, v3 schemes)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "$ALIAS_NAME" \
            --ks-pass "pass:$PASS_VAL" --key-pass "pass:$KPASS_VAL" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

          # Remove keystore file immediately after signing
          rm -f release.keystore

          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify -v android/app/build/outputs/apk/release/app-release-signed.apk
          echo "APK successfully signed and verified!"

      - name: Upload Installable Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-signed-apk-v${{ inputs.build_version }}
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 14

      - name: Upload Unsigned Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-release-aab-v${{ inputs.build_version }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14