name: White-Label iOS Application Build

# Runs ONLY when manually launched from the GitHub Actions tab.
# It does NOT run on commit, push, or pull request.
on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Unique Client Slug (e.g., pushtiprakash)'
        required: true
        default: 'pushtiprakash'
        type: string
      app_name:
        description: 'iOS App Display Name (e.g., PushtiPrakash)'
        required: true
        default: 'PushtiPrakash'
        type: string
      app_id:
        description: 'Apple Bundle Identifier (e.g., com.pushtiprakash.reader)'
        required: true
        default: 'com.pushtiprakash.reader'
        type: string
      firebase_config_url:
        description: 'Remote Config URL for this Client'
        required: true
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/mock/'
        type: string
      logo_url:
        description: 'Direct URL to Client Logo PNG (for iOS AppIcon & Notifications)'
        required: false
        default: 'https://cdn.jsdelivr.net/gh/shreeg-sg/pushtiprakash-media@main/src/assets/images/logo.png'
        type: string
      build_version:
        description: 'Semantic App Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Apple Build Number / CFBundleVersion (e.g., 1, 2, 3...)'
        required: true
        default: '1'
        type: string

jobs:
  build-client-ios:
    name: Build iOS Package for ${{ inputs.client_key }}
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Inject Client Config URL & Version into environment.prod.ts
        env:
          CLIENT_KEY: ${{ inputs.client_key }}
          FIREBASE_URL: ${{ inputs.firebase_config_url }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src/environments/environment.prod.ts";
            let content = fs.readFileSync(path, "utf8");
            const safeStr = (val) => String(val || "").replace(/\\/g, "\\\\").replace(/\x27/g, "\\\x27");
            content = content.replace(/__CLIENT_KEY__/g, safeStr(process.env.CLIENT_KEY));
            content = content.replace(/__FIREBASE_CONFIG_URL__/g, safeStr(process.env.FIREBASE_URL));
            content = content.replace(/__BUILD_VERSION__/g, safeStr(process.env.BUILD_VERSION));
            fs.writeFileSync(path, content, "utf8");
          '
          cat src/environments/environment.prod.ts
          APP_NAME="${{ inputs.app_name }}" FIREBASE_URL="${{ inputs.firebase_config_url }}" node -e '
            const fs = require("fs");
            const idxPath = "src/index.html";
            let html = fs.readFileSync(idxPath, "utf8");
            const appName = String(process.env.APP_NAME || "").trim();
            if (appName) {
              const esc = appName.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
              html = html.replace(/<title>.*?<\/title>/, `<title>${esc}</title>`);
            }
            try {
              const origin = new URL(process.env.FIREBASE_URL || "").origin;
              if (origin && origin.startsWith("https://") && !html.includes(origin)) {
                html = html.replace(/https:\/\/cdn\.jsdelivr\.net/g, `https://cdn.jsdelivr.net ${origin}`);
              }
            } catch {}
            fs.writeFileSync(idxPath, html, "utf8");
          '

      - name: Stamp Client App ID and Name in Capacitor Config
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.appId = process.env.APP_ID;
            cfg.appName = process.env.APP_NAME;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

      - name: Build Angular Production Web Bundle
        run: npm run build -- --configuration=production

      - name: Add and Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Stamp iOS App Name, Bundle ID & Version in Info.plist & Xcode Project
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
          BUILD_VERSION: ${{ inputs.build_version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName \"${APP_NAME}\"" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string \"${APP_NAME}\"" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName \"${APP_NAME}\"" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString \"${BUILD_VERSION}\"" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion \"${VERSION_CODE}\"" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST_PATH" || true
          fi
          node -e '
            const fs = require("fs");
            const pbxPath = "ios/App/App.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbxPath)) {
              let pbx = fs.readFileSync(pbxPath, "utf8");
              const appId = String(process.env.APP_ID || "com.pushtiprakash.reader").replace(/[^a-zA-Z0-9._-]/g, "");
              pbx = pbx.replace(/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/g, `PRODUCT_BUNDLE_IDENTIFIER = ${appId};`);
              fs.writeFileSync(pbxPath, pbx, "utf8");
            }
          '
          python3 -c "
          import os, re
          app_del = 'ios/App/App/AppDelegate.swift'
          if os.path.exists(app_del):
              with open(app_del, 'r', encoding='utf-8') as f:
                  swift = f.read()
              if 'enableScreenCaptureProtection' not in swift:
                  swift = swift.replace('var window: UIWindow?', 'var window: UIWindow?\n    private var secureField: UITextField?', 1)
                  swift = swift.replace('return true', 'enableScreenCaptureProtection()\n        return true', 1)
                  helper = '\n    private func enableScreenCaptureProtection() {\n        guard let win = self.window else { return }\n        if secureField == nil {\n            let field = UITextField()\n            field.isSecureTextEntry = true\n            win.addSubview(field)\n            win.layer.superlayer?.addSublayer(field.layer)\n            field.layer.sublayers?.last?.addSublayer(win.layer)\n            secureField = field\n        }\n        NotificationCenter.default.addObserver(forName: UIScreen.capturedDidChangeNotification, object: nil, queue: .main) { [weak win] _ in\n            win?.isHidden = UIScreen.main.isCaptured\n        }\n        win.isHidden = UIScreen.main.isCaptured\n    }\n'
                  idx = swift.rfind('}')
                  if idx != -1:
                      swift = swift[:idx] + helper + swift[idx:]
                  with open(app_del, 'w', encoding='utf-8') as f:
                      f.write(swift)
          " 

      - name: Stamp iOS App & Notification Icon from Client Logo
        env:
          LOGO_URL: ${{ inputs.logo_url }}
        run: |
          mkdir -p /tmp
          if [ -f "src/assets/images/logo.png" ]; then
            echo "Found logo locally at src/assets/images/logo.png"
            cp src/assets/images/logo.png /tmp/logo.png
          elif [ -n "$LOGO_URL" ]; then
            echo "Downloading logo from remote URL $LOGO_URL..."
            curl -s -L "$LOGO_URL" -o /tmp/logo.png || true
          fi

          if [ -s /tmp/logo.png ]; then
            python3 -m pip install --break-system-packages --quiet Pillow || python3 -m pip install --quiet Pillow || true
            ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$ICON_DIR"

            python3 - << 'PYEOF'
          import os
          from PIL import Image

          logo_path = '/tmp/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert('RGBA')
              icon_dir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset'
              targets = {
                  'AppIcon-512@2x.png': 1024,
                  'AppIcon-60@3x.png': 180,
                  'AppIcon-60@2x.png': 120,
                  'AppIcon-83.5@2x.png': 167,
                  'AppIcon-76@2x.png': 152,
                  'AppIcon-76@1x.png': 76,
                  'AppIcon-40@3x.png': 120,
                  'AppIcon-40@2x.png': 80,
                  'AppIcon-29@3x.png': 87,
                  'AppIcon-29@2x.png': 58,
                  'AppIcon-20@3x.png': 60,
                  'AppIcon-20@2x.png': 40
              }
              for fname, size in targets.items():
                  fg_size = int(size * 0.68)
                  resized = img.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGBA', (size, size), (255, 253, 249, 255))
                  offset = ((size - fg_size) // 2, ((size - fg_size) // 2))
                  canvas.paste(resized, offset, mask=resized)
                  canvas.convert('RGB').save(f'{icon_dir}/{fname}')
              print('Generated 68% scaled iOS app & notification icons without alpha transparency.')
          PYEOF

            cat << 'EOF' > "$ICON_DIR/Contents.json"
          {
            "images": [
              { "idiom": "universal", "platform": "ios", "size": "1024x1024", "filename": "AppIcon-512@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "60x60", "filename": "AppIcon-60@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "60x60", "filename": "AppIcon-60@2x.png" },
              { "idiom": "ipad", "scale": "2x", "size": "83.5x83.5", "filename": "AppIcon-83.5@2x.png" },
              { "idiom": "ipad", "scale": "2x", "size": "76x76", "filename": "AppIcon-76@2x.png" },
              { "idiom": "ipad", "scale": "1x", "size": "76x76", "filename": "AppIcon-76@1x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "40x40", "filename": "AppIcon-40@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "40x40", "filename": "AppIcon-40@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "29x29", "filename": "AppIcon-29@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "29x29", "filename": "AppIcon-29@2x.png" },
              { "idiom": "iphone", "scale": "3x", "size": "20x20", "filename": "AppIcon-20@3x.png" },
              { "idiom": "iphone", "scale": "2x", "size": "20x20", "filename": "AppIcon-20@2x.png" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
            echo "Successfully generated iOS AppIcon catalog scaled at 68%!"
          else
            echo "Warning: Logo PNG not found, defaulting to template icons."
          fi

      - name: Build, Archive & Sign iOS IPA (Uses Apple GitHub Secrets When Configured)
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE_BASE64" ] && [ -n "$TEAM_ID" ]; then
            echo "Apple signing secrets detected — configuring temporary keychain and provisioning profile..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASS=$(openssl rand -hex 16)
            CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
            PROFILE_PATH="$RUNNER_TEMP/app_profile.mobileprovision"

            echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

            cat << EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

            cd ios/App
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath build/ipa

            rm -f "$CERT_PATH" "$PROFILE_PATH" "$RUNNER_TEMP/ExportOptions.plist"
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "Signed iOS IPA exported successfully!"
          else
            echo "Notice: Apple signing secrets (IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID) not configured. Building unsigned xcarchive."
            cd ios/App
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Upload Signed iOS IPA (When Signed)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-signed-ipa-v${{ inputs.build_version }}
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Purge jsDelivr CDN Cache for Active Tenant
        env:
          CONFIG_URL: ${{ inputs.firebase_config_url }}
        run: |
          if [[ "$CONFIG_URL" == *"cdn.jsdelivr.net/gh/"* ]]; then
            PURGE_BASE="${CONFIG_URL/https:\/\/cdn.jsdelivr.net\/gh\//https:\/\/purge.jsdelivr.net\/gh\/}"
            PURGE_BASE="${PURGE_BASE%/}/"
            for f in app_identity.json supportedLanguages.json ui_translations.json books.json updateBannerMessage.json about_info.json notification_schedules.json advertisement.json auth_config.json; do
              curl -s "${PURGE_BASE}${f}" || true
            done
          fi

      - name: Upload iOS Xcode Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_key }}-ios-xcarchive-v${{ inputs.build_version }}
          path: ios/App/build/App.xcarchive
          retention-days: 14

