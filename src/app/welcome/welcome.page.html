<ion-content [fullscreen]="true" class="welcome-content">
  <div class="welcome">
    <div class="welcome__card">
      <div class="welcome__badge">
        <ion-icon name="sparkles-outline" aria-hidden="true"></ion-icon>
      </div>

      <ion-text color="dark">
        <h1 class="welcome__title">{{ appName }}</h1>
      </ion-text>

      <p class="welcome__tagline">{{ tagline }}</p>

      @if (started) {
        <p class="welcome__message" role="status">
          You are all set. Let's build something great.
        </p>
      } @else {
        <ion-button class="welcome__cta" shape="round" size="large" (click)="getStarted()">
          Get started
          <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      }
    </div>
  </div>
</ion-content>
